    <script src="js/pages/tables/jquery-datatable.js"></script>
    <script src="../../js/pages/forms/form-validation.js"></script>

    <!-- Demo Js -->
    <script src="js/demo.js"></script>

    <script>
        $(document).ready(function() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            $.ajax({
                url: window.baseUrl + '/patient/view/' + id,
                type: 'GET',
                success: function(data) {
                    $('#patient-name').text(data.firstName + " " + data.lastName);
                    $('#patient-phone-number').text(data.phoneNumber);
                    $('#patient-phone-number').attr('href', "tel:" + data.phoneNumber);
                    $('#update-button').attr('href', "update-patient.html?source=profile&id=" + data.id);
                    $('#bill-patient-button').attr('href', "bill-patient.html?id=" + data.id);
                    $('#paid-bills-button').attr('href', "paid-bills.html?id=" + data.id);
                },
                error: function(error) {
                    alert("Error fetching patient data");
                }
            });

            $.ajax({
                url: window.baseUrl + '/billing/patient/' + id,
                type: 'GET',
                success: function(data) {
                    const unpaidBillsTableBody = $('#unpaidBillsDataTable tbody');
                    unpaidBillsTableBody.empty();

                    const paidBillsTableBody = $('#paidBillsDataTable tbody');
                    paidBillsTableBody.empty();


                    data.forEach(billing => {
                        if (billing.status.name == "Unpaid") {
                            const row = $('<tr></tr>');
                            row.append('<td>' + billing.id + '</td>');
                            row.append('<td>' + formatDate(billing.createdDate) + '</td>');
                            row.append('<td>$' + billing.totalCost + '</td>');
                            row.append("<td><div class=\"icon-button-demo\">" +
                            "<button type=\"button\" class=\"btn btn-primary btn-circle waves-effect waves-circle waves-float\"><a href=\"billing.html?id=" + billing.id + "\" style=\"color: white\"><i class=\"material-icons\">info</i></a></button>" +
                            "</div></td>");
                            unpaidBillsTableBody.append(row);
                        } else if (billing.status.name == "Paid") {
                            const row = $('<tr></tr>');
                            row.append('<td>' + billing.id + '</td>');
                            row.append('<td>' + formatDate(billing.createdDate) + '</td>');
                            row.append('<td>$' + billing.totalCost + '</td>');
                            row.append("<td><div class=\"icon-button-demo\">" +
                            "<button type=\"button\" class=\"btn btn-primary btn-circle waves-effect waves-circle waves-float\"><a href=\"billing.html?id=" + billing.id + "\" style=\"color: white\"><i class=\"material-icons\">info</i></a></button>" +
                            "</div></td>");
                            paidBillsTableBody.append(row);
                        }
                    });

                    $('#unpaidBillsDataTable').DataTable();
                    $('#paidBillsDataTable').DataTable();
                },
                error: function(error) {
                    alert("Error fetching billing data");
                }
            });


            $('#delete-button').on('click', function() {
                if (confirm("Are you sure you want to delete this patient?")) {
                    $.ajax({
                        url: window.baseUrl + '/patient/delete/' + id,
                        type: 'DELETE',
                        success: function(response) {
                            // Handle successful deletion
                            alert('Patient deleted successfully!');
                            window.location.href = 'patients.html';
                        },
                        error: function(error) {
                            // Handle error
                            console.error('Error deleting patient:', error);
                            alert('Error deleting patient. Please try again.');
                        }
                    });
                }
            });
        });
    </script>
</body>

</html>
