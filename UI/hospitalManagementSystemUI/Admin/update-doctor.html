    </div>
    <!-- #END# Page Loader -->

    <!-- #END# Overlay For Sidebars -->

    <section class="content">
        <div class="container-fluid">
            <div class="block-header">
                <h2>DOCTORS</h2>
            </div>
            <div class="row clearfix">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                    <div class="card">
                        <div class="header">
                            <h2>Update Doctor</h2>                            
                        </div>
                        <div class="body">
                            <form id="form_validation" method="POST">
                                <div class="form-group form-float">
                                    <div class="form-line">
                                        <input type="text" class="form-control" name="first_name" required>
                                        <label class="form-label">First Name</label>
                                    </div>
                                </div>
                                <div class="form-group form-float">
                                    <div class="form-line">
                                        <input type="text" class="form-control" name="last_name" required>
                                        <label class="form-label">Last Name</label>
                                    </div>
                                </div>
                                <div class="form-group form-float">
                                    <div class="form-line">
                                        <input type="text" class="form-control" name="phone_number" required>
                                        <label class="form-label">Phone Number</label>
                                    </div>
                                </div>
                                <div class="row clearfix">
                                    <div class="col-xs-6">
                                        <p class="card-inside-title">Date of Joining</p>
                                        <div class="form-group">
                                            <div class="form-line" id="bs_datepicker_container">
                                                <input type="date" name="date_of_joining" class="form-control" placeholder="Please choose a date..." required>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <p class="card-inside-title">Specialization</p>
                                        <div id="specialization-div">
                                            <select class="form-control show-tick" id="specialization" name="specialization" required>
                                                <option value="">-- Please select --</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <button class="btn bg-red waves-effect" type="submit">UPDATE</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Jquery Core Js -->
    <script src="plugins/jquery/jquery.min.js"></script>

    <!-- Bootstrap Core Js -->

    <!-- Sweet Alert Plugin Js -->
    <script src="plugins/sweetalert/sweetalert.min.js"></script>
    
    <!-- Waves Effect Plugin Js -->
    <script src="plugins/node-waves/waves.js"></script>

    <!-- Jquery DataTable Plugin Js -->
    <script src="plugins/jquery-datatable/jquery.dataTables.js"></script>
    <script src="plugins/jquery-datatable/skin/bootstrap/js/dataTables.bootstrap.js"></script>
    <script src="plugins/jquery-datatable/extensions/export/dataTables.buttons.min.js"></script>
    <script src="plugins/jquery-datatable/extensions/export/buttons.flash.min.js"></script>
    <script src="plugins/jquery-datatable/extensions/export/jszip.min.js"></script>
    <script src="plugins/jquery-datatable/extensions/export/pdfmake.min.js"></script>
    <script src="plugins/jquery-datatable/extensions/export/vfs_fonts.js"></script>
    <script src="plugins/jquery-datatable/extensions/export/buttons.html5.min.js"></script>
    <script src="plugins/jquery-datatable/extensions/export/buttons.print.min.js"></script>

    <!-- Moment Plugin Js -->
    <script src="plugins/momentjs/moment.js"></script>

    <!-- Bootstrap Material Datetime Picker Plugin Js -->
    <script src="plugins/bootstrap-material-datetimepicker/js/bootstrap-material-datetimepicker.js"></script>

    <!-- Bootstrap Datepicker Plugin Js -->
    <script src="plugins/bootstrap-datepicker/js/bootstrap-datepicker.js"></script>

    <!-- Custom Js -->
    <script src="js/admin.js"></script>
    <script src="js/pages/tables/jquery-datatable.js"></script>
    <script src="js/pages/forms/form-validation.js"></script>

    <!-- Demo Js -->
    <script src="js/demo.js"></script>

    <script>
        $(document).ready(function() {
            const urlParams = new URLSearchParams(window.location.search);
            const source = urlParams.get('source');
            const id = urlParams.get('id');
            let specializationValue = '';

            $.ajax({
                url: window.baseUrl + '/doctor/view/' + id,
                type: 'GET',
                success: function(data) {
                    $('input[name="first_name"]').val(data.firstName).focus();
                    $('input[name="last_name"]').val(data.lastName).focus();
                    $('input[name="phone_number"]').val(data.phoneNumber).focus();
                    $('input[name="date_of_joining"]').val(data.dateOfJoining.split('T')[0]);
                    specializationValue = data.specialization.id;
                },
                error: function(error) {
                    alert("Error fetching doctor data");
                }
            });

            $.ajax({
                url: window.baseUrl + '/doctor/specialization',
                type: 'GET',
                success: function(data) {
                    const specializationDivElement = $('#specialization-div');
                    const selectElement = $('#specialization');
                    selectElement.empty();

                    let optionsHtml = '';
                    data.forEach(specialization => {
                        if (specializationValue == specialization.id) {
                            optionsHtml += `<option selected value="${specialization.id}">${specialization.name}</option>`;
                        } else {
                            optionsHtml += `<option value="${specialization.id}">${specialization.name}</option>`;
                        }
                    });
                    selectElement.append(optionsHtml);

                    specializationDivElement.html(selectElement);
                },
                error: function(error) {
                    alert("Error fetching staff specialization data");
                }
            });


            $('#form_validation').submit(function(event) {
                event.preventDefault(); 

                const firstName = $('input[name="first_name"]').val();
                const lastName = $('input[name="last_name"]').val();
                const phoneNumber = $('input[name="phone_number"]').val();
                const dateOfJoining = $('input[name="date_of_joining"]').val();
                const specialization = parseInt($('select[name="specialization"]').val());

                $.ajax({
                    url: window.baseUrl + '/doctor/update', 
                    type: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    data: JSON.stringify({
                        id: parseInt(id),
                        firstName: firstName,
                        lastName: lastName,
                        phoneNumber: phoneNumber,
                        dateOfJoining: dateOfJoining,
                        specialization: {
                            id: specialization
                        }
                    }),
                    success: function(response) {
                        console.log('Doctor updated successfully:', response);
                        alert('Doctor updated successfully!');
                        if (source == "profile") {
                            window.location.href = 'doctor.html?id=' + id;
                        } else {
                            window.location.href = 'doctors.html';
                        }
                    },
                    error: function(error) {
                        // Handle errors, e.g., show an error message
                        console.error('Error updating doctor:', error);
                        alert('Error updating doctor. Please try again.');
                    }
                });
            });
        });
    </script>
</body>
