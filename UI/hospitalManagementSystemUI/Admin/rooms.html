    <section class="content">

            <!-- Exportable Table -->

                    <div class="card">
                        <div class="header">

                                View All Rooms

                        </div>
                        <div class="body">
                            <div class="row clearfix">
                                <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
                                    <ul class="nav nav-tabs tab-col-green" role="tablist">
                                        <li role="presentation" class="active">

                                        <li role="presentation">

                                        </li>
                                        <li role="presentation">
                                            <a href="#operation_theater" id="operation_theater_title" data-toggle="tab">Operation Theater</a>
                                        </li>

                                        </li>
                                    </ul>
                                    <!-- Tab panes -->
                                    <div class="tab-content">
                                        <div role="tabpanel" class="tab-pane fade in active" id="general_ward">
                                            
                                        </div>
                                        <div role="tabpanel" class="tab-pane fade" id="icu">

                                        </div>
                                        <div role="tabpanel" class="tab-pane fade" id="operation_theater">

                                        </div>
                                        <div role="tabpanel" class="tab-pane fade" id="emergency_rooms">

                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- #END# Exportable Table -->
        </div>

    <!-- Jquery Core Js -->
    <script src="plugins/jquery/jquery.min.js"></script>

    <!-- Bootstrap Core Js -->
    <script src="plugins/bootstrap/js/bootstrap.js"></script>

    <!-- Select Plugin Js -->
    <script src="plugins/bootstrap-select/js/bootstrap-select.js"></script>

    <!-- Slimscroll Plugin Js -->

    <!-- Waves Effect Plugin Js -->

    <!-- Jquery DataTable Plugin Js -->

    <script src="plugins/jquery-datatable/skin/bootstrap/js/dataTables.bootstrap.js"></script>
    <script src="plugins/jquery-datatable/extensions/export/dataTables.buttons.min.js"></script>
    <script src="plugins/jquery-datatable/extensions/export/buttons.flash.min.js"></script>
    <script src="plugins/jquery-datatable/extensions/export/jszip.min.js"></script>
    <script src="plugins/jquery-datatable/extensions/export/pdfmake.min.js"></script>
    <script src="plugins/jquery-datatable/extensions/export/vfs_fonts.js"></script>
    <script src="plugins/jquery-datatable/extensions/export/buttons.html5.min.js"></script>
    <script src="plugins/jquery-datatable/extensions/export/buttons.print.min.js"></script>

    <!-- Custom Js -->
    <script src="js/admin.js"></script>
    <script src="js/pages/tables/jquery-datatable.js"></script>

    <!-- Demo Js -->
    <script src="js/demo.js"></script>

    <script>
        $(document).ready(function() {
            $.ajax({
                url: window.baseUrl + '/room/list',
                type: 'GET',
                success: function(data) {
                    const generalWardContainer = $('#general_ward');
                    const icuContainer = $('#icu');
                    const operationTheaterContainer = $('#operation_theater');
                    const emergencyRoomsContainer = $('#emergency_rooms');

                    let generalWardAvailableCount = 0;
                    let icuAvailableCount = 0;
                    let operationTheaterAvailableCount = 0;
                    let emergencyRoomAvailableCount = 0;

                    let generalWardTotalCount = 0;
                    let icuTotalCount = 0;
                    let operationTheaterTotalCount = 0;
                    let emergencyRoomTotalCount = 0;

                    data.forEach(room => {
                        const cardHtml = `
                                <div class="col-lg-4 col-md-4 col-sm-6 col-xs-12">
                                    <div class="card">
                                        ${room.patient ? "<div class=\"header bg-green\">" : "<div class=\"header bg-red\">"}
                                            <h2>${room.name} <small>${room.type.name}</small></h2>
                                        </div>
                                        <div class="body">
                                            ${room.patient ? 'Patient Name: <a href="patient.html?id=' + room.patient.id + '">' + room.patient.firstName + ' ' + room.patient.lastName + '</a>' : 'Available !!!'}
                                        </div>
                                    </div>
                                </div>
                            `;
                        if (room.type.name == "General Ward") {
                            generalWardContainer.append(cardHtml);
                            generalWardTotalCount++;
                            if (room.patient == null) generalWardAvailableCount++;
                        } else if (room.type.name == "ICU") {
                            icuContainer.append(cardHtml);
                            icuTotalCount++;
                            if (room.patient == null) icuAvailableCount++;
                        } else if (room.type.name == "Operation Theater") {
                            operationTheaterContainer.append(cardHtml);
                            operationTheaterTotalCount++;
                            if (room.patient == null) operationTheaterAvailableCount++;
                        } else if (room.type.name == "Emergency Room") {
                            emergencyRoomsContainer.append(cardHtml);
                            emergencyRoomTotalCount++;
                            if (room.patient == null) emergencyRoomAvailableCount++;
                        }
                    });

                    $('#general_ward_title').append(' (' + generalWardAvailableCount + '/' + generalWardTotalCount + ')');
                    $('#icu_title').append(' (' + icuAvailableCount + '/' + icuTotalCount + ')');
                    $('#operation_theater_title').append(' (' + operationTheaterAvailableCount + '/' + operationTheaterTotalCount + ')');
                    $('#emergency_rooms_title').append(' (' + emergencyRoomAvailableCount + '/' + emergencyRoomTotalCount + ')');
                },
                error: function(error) {
                    alert("Error fetching rooms data");
                }
            });
        });
    </script>
</body>
